<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Routing Waterway System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="map"></div>

<div id="sidebar">
    <div class="tab-menu">
        <button id="tabRoute" class="tab-btn active" type="button">Route planner</button>
        <button id="tabArchive" class="tab-btn" type="button">Archive routes</button>
    </div>

    <section id="routePanel" class="tab-panel active">
        <h2>Расчёт маршрута</h2>
        <form id="routeForm">
            <fieldset>
                <legend>Координата A</legend>
                <div class="field-block">
                    <label>Долгота:
                        <input id="startLon" type="text" />
                    </label>
                </div>
                <div class="field-block">
                    <label>Широта:
                        <input id="startLat" type="text" />
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Координата B</legend>
                <div class="field-block">
                    <label>Долгота:
                        <input id="endLon" type="text" />
                    </label>
                </div>
                <div class="field-block">
                    <label>Широта:
                        <input id="endLat" type="text" />
                    </label>
                </div>
            </fieldset>

            <div class="field-block">
                <label>Время отправления:
                    <input type="datetime-local" id="departureTime" />
                </label>
            </div>

            <div class="field-block">
                <label>Скорость (км/ч):
                    <input type="number" id="speed" min="1" value="12" />
                </label>
            </div>

            <div class="field-block">
                <button type="submit" id="calculateBtn">Рассчитать маршрут</button>
                <button id="clearPoints" type="button">Очистить точки</button>
            </div>

            <div id="progressContainer">
                <div id="progressBar"></div>
            </div>

            <div id="routeResult"></div>
        </form>
    </section>

    <section id="archivePanel" class="tab-panel">
        <h2>Архив рейсов</h2>
        <form id="archiveSearchForm" autocomplete="off">
            <div class="field-row">
                <div class="field-block">
                    <label>Город отправления
                        <input id="archiveFromCity" type="text" list="archiveCitySuggestions" placeholder="Например, Нижний Новгород" autocomplete="new-password" spellcheck="false" />
                    </label>
                </div>
                <div class="field-block">
                    <label>Город прибытия
                        <input id="archiveToCity" type="text" list="archiveCitySuggestions" placeholder="Например, Казань" autocomplete="new-password" spellcheck="false" />
                    </label>
                </div>
            </div>

            <datalist id="archiveCitySuggestions"></datalist>

            <div class="field-row">
                <div class="field-block">
                    <label>Дата отправления от
                        <input id="archiveDateFrom" type="date" />
                    </label>
                </div>
                <div class="field-block">
                    <label>Дата отправления до
                        <input id="archiveDateTo" type="date" />
                    </label>
                </div>
            </div>

            <div class="field-row">
                <button id="archiveSearchBtn" type="submit">Найти рейсы</button>
                <button id="archiveClearBtn" type="button">Сбросить</button>
            </div>
        </form>

        <div id="archiveSummary">Введите фильтры и нажмите «Найти рейсы».</div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Откуда</th>
                    <th>Куда</th>
                    <th>Отправление</th>
                    <th>Прибытие</th>
                    <th>Дней</th>
                </tr>
                </thead>
                <tbody id="archiveTripsBody">
                <tr><td colspan="6">Нет данных</td></tr>
                </tbody>
            </table>
        </div>

        <div class="archive-pagination">
            <button id="archivePrevPage" type="button">←</button>
            <span id="archivePaginationInfo">Страница 1</span>
            <button id="archiveNextPage" type="button">→</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Маршрут</th>
                    <th>Месяц</th>
                    <th>Рейсов</th>
                    <th>P50 (дн)</th>
                    <th>P80 (дн)</th>
                    <th>Диапазон</th>
                </tr>
                </thead>
                <tbody id="archiveStatsBody">
                <tr><td colspan="6">Нет статистики</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
